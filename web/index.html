<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadOutTo.me</title>
  <meta name="description" content="Read text out loud online using natural-sounding voices. Paste or type your text and listen instantly.">
  <meta name="author" content="ReadOutTo.me">
  <meta name="theme-color" content="#f7e9d9">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="ReadOutTo" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- open graph tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ReadOutTo.me">
  <meta property="og:description" content="Read text out loud online using natural-sounding voices. Paste or type your text and listen instantly.">
  <meta property="og:url" content="https://readoutto.me">
  <meta property="og:site_name" content="ReadOutTo.me">
  <meta property="og:locale" content="en_US">

  <!-- twitter tags -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ReadOutTo.me">
  <meta name="twitter:description" content="Read text out loud online using natural-sounding voices. Paste or type your text and listen instantly.">

  <link rel="preload" href="vendor/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin>
  <link href="vendor/beer.min.css" rel="stylesheet">
  <script type="module" src="vendor/beer.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" type="module" defer></script>
</head>

<body>
  <h1>Read<span class="subtle" data-text="·" aria-hidden="true"></span>Out<span class="subtle" data-text="·" aria-hidden="true"></span>To<span class="subtle selectable" aria-label="dot">.</span>me</h1>
  <p>Read text out online</p>


  <main class="responsive">
    <div class="field label border">
      <!-- rows attribute is set to disable automatic resizing, see https://github.com/beercss/beercss/blob/main/docs/TEXTAREA.md -->
      <textarea id="toread-textarea" rows="10"></textarea>
      <label for="toread-textarea">Text to read</label>
    </div>

    <fieldset>
      <legend>
        <i aria-hidden="true">settings</i>
        <span>Options</span>
      </legend>
      <div class="field border prefix suffix label">
        <i aria-hidden="true">translate</i>
        <select id="lang-select" autocomplete="off">
          <option value="en-US" selected>American English</option>
        </select>
        <label for="lang-select">Language</label>
        <i aria-hidden="true">arrow_drop_down</i>
      </div>
      <div class="field border prefix suffix label">
        <i aria-hidden="true">lips</i>
        <select id="voice-select" autocomplete="off">
          <option value="en-US-AvaNeural" selected>Ava</option>
        </select>
        <label for="voice-select">Speaker</label>
        <i aria-hidden="true">arrow_drop_down</i>
      </div>
    </fieldset>
    <br>
    <button id="play-audio-btn" class="responsive border vertical">
      <i aria-hidden="true">wand_stars</i>
      <span>Play Audio</span>
    </button>
    <br>
  </main>
</body>

</html>
