<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadOutTo me</title>
  <link href="https://cdn.jsdelivr.net/npm/beercss@4.0.21/dist/cdn/beer.min.css" rel="stylesheet">
  <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@4.0.21/dist/cdn/beer.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" type="module" defer></script>
</head>

<body>
  <h1>Read<span class="subtle" data-text="·" aria-hidden="true"></span>Out<span class="subtle" data-text="·" aria-hidden="true"></span>To<span class="subtle selectable">.</span>me</h1>
  <p>Read text out online</p>


  <main class="responsive">
    <div class="field label border">
      <!-- rows attribute is set to disable automatic resizing, see https://github.com/beercss/beercss/blob/main/docs/TEXTAREA.md -->
      <textarea id="toread-textarea" rows="10"></textarea>
      <label>Text to read</label>
    </div>

    <fieldset>
      <legend>
        <i>settings</i>
        <span>Options</span>
      </legend>
      <div class="field border prefix suffix label">
        <i>translate</i>
        <select>
          <option selected>English (United States)</option>
        </select>
        <label>Language</label>
        <i>arrow_drop_down</i>
      </div>
      <div class="field border prefix suffix label">
        <i>lips</i>
        <select>
          <option selected>[RANDOM] Neutral</option>
        </select>
        <label>Speaker</label>
        <i>arrow_drop_down</i>
      </div>
    </fieldset>
    <br>
    <button id="play-audio-btn" class="responsive border vertical">
      <i>wand_stars</i>
      <span>Play Audio</span>
    </button>
    <br>
  </main>
</body>

</html>
